<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инженерный квест: Оператор АЭС — Pro-БГУТ</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body.quest-body {
            background-color: #030b18;
            overflow-y: auto;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }

        .quest-container {
            width: 100vw;
            min-height: 100vh;
            /* Исправлено отображение фона aes.jpg без чрезмерного растягивания */
            background-color: #030b18;
            background-image: linear-gradient(rgba(3, 11, 24, 0.7), rgba(3, 11, 24, 0.8)), url('aes.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 2vh 4vw;
            gap: 15px;
            box-sizing: border-box;
        }

        /* Шапка БГУТ */
        .quest-header {
            background-image: url('fon.jpg');
            background-size: cover;
            background-position: center;
            border: 1px solid rgba(0, 210, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            padding: 0.8vw 2vw;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 1100px;
            box-sizing: border-box;
        }

        .quest-header .logo-text h1 {
            color: #ffffff;
            font-size: 1.4vw;
            text-shadow: 0 0 12px rgba(0, 210, 255, 0.6);
            margin: 0;
        }

        .quest-header .logo-text p {
            color: #93bde8;
            font-size: 0.85vw;
            margin: 0;
        }

        /* Основной контент */
        .quest-main {
            max-width: 1100px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        /* Стеклянная рамка */
        .glass-card {
            background: rgba(13, 40, 75, 0.88);
            border: 2px solid rgba(0, 210, 255, 0.5);
            box-shadow: 0 20px 45px rgba(0, 150, 255, 0.25);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            text-align: center;
            max-width: 750px;
            width: 100%;
            animation: fadeIn 0.4s ease forwards;
        }

        .glass-card h2 {
            color: #4df3ff;
            font-size: 1.8vw;
            font-weight: 800;
            margin: 0;
            text-shadow: 0 0 12px rgba(0, 210, 255, 0.6);
        }

        .typewriter-text {
            color: #ffffff;
            font-size: 1.1vw;
            line-height: 1.5;
            margin: 0;
            min-height: 70px;
        }

        /* Кнопка «Начать!» крупными буквами и по центру */
        .start-btn {
            font-size: 1.4vw !important;
            font-weight: 800 !important;
            letter-spacing: 1.5px;
            padding: 14px 45px !important;
            margin: 10px auto 0 auto !important;
            display: block;
        }

        /* Компактный блок Шага 1 */
        .step-content-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .step-desc {
            color: #cbd5e1;
            font-size: 0.95vw;
            margin: 0;
            max-width: 600px;
        }

        /* Слот реактора (компактнее) */
        .reactor-slot {
            width: 130px;
            height: 130px;
            border: 3px dashed #38bdf8;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 150, 255, 0.08);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .reactor-slot.drag-over {
            border-color: #4df3ff;
            background: rgba(0, 210, 255, 0.25);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.6);
        }

        .reactor-slot img {
            width: 75px;
            height: 75px;
            object-fit: contain;
        }

        .reactor-slot span {
            color: #93bde8;
            font-size: 0.8vw;
        }

        /* Компактный инвентарь сбоку/снизу */
        .inventory-panel {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .inventory-item {
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(0, 210, 255, 0.4);
            border-radius: 12px;
            padding: 10px;
            width: 95px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: grab;
            transition: all 0.3s ease;
        }

        .inventory-item:hover {
            border-color: #4df3ff;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.5);
            transform: translateY(-2px);
        }

        .inventory-item img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .inventory-item span {
            color: #ffffff;
            font-size: 0.75vw;
            font-weight: 600;
            text-align: center;
        }

        /* Встроенные уведомления (вместо системных alert) */
        .inline-message {
            font-size: 0.95vw;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 8px;
            min-height: 24px;
            transition: opacity 0.3s ease;
            display: none;
        }

        .inline-message.error {
            background: rgba(255, 77, 77, 0.2);
            border: 1px solid #ff4d4d;
            color: #ff6b6b;
        }

        .inline-message.success {
            background: rgba(0, 210, 255, 0.2);
            border: 1px solid #4df3ff;
            color: #4df3ff;
        }

        /* Подсказка */
        .hint-box {
            background: rgba(255, 193, 7, 0.15);
            border: 1px solid #ffc107;
            color: #ffe066;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 0.85vw;
            display: none;
            max-width: 600px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="quest-body" onload="initGame()">

    <div class="quest-container">
        
        <!-- Шапка БГУТ -->
        <header class="quest-header">
            <div class="logo-box">
                <img src="emblema.png" alt="Эмблема БГУТ" class="logo-img" style="width: 40px; height: 40px;">
                <div class="logo-text">
                    <h1>Pro-БГУТ: студент на час</h1>
                    <p>Твой путь начинается здесь</p>
                </div>
            </div>
            <button class="pro-btn" id="btnBack" style="width: auto; padding: 6px 15px; font-size: 0.85vw;">Назад</button>
        </header>

        <!-- Основная часть -->
        <main class="quest-main">
            <div id="gameContent"></div>
        </main>

    </div>

    <script>
        document.getElementById('btnBack').addEventListener('click', function() {
            window.location.href = 'testdrive.html';
        });

        let hintTimer = null;
        let messageTimer = null;

        // ================= ЭКРАН 1: ВСТУПЛЕНИЕ =================
        function initGame() {
            const container = document.getElementById('gameContent');
            container.innerHTML = `
                <div class="glass-card">
                    <h2>Оператор АЭС: Спасти реактор</h2>
                    <p class="typewriter-text" id="introText"></p>
                    <button class="pro-btn start-btn" id="startBtn" style="display: none;" onclick="startStep1()">НАЧАТЬ!</button>
                </div>
            `;

            const fullText = "Внимание! На энергоблоке №1 зафиксирован сбой. Система охлаждения отключена, температура активной зоны стремительно растет! Если температура достигнет критической отметки — произойдет авария. Вы — дежурный инженер. Ваша задача — восстановить систему управления!";
            
            let i = 0;
            const speed = 25;
            const textElement = document.getElementById('introText');

            function typeWriter() {
                if (i < fullText.length) {
                    textElement.innerHTML += fullText.charAt(i);
                    i++;
                    setTimeout(typeWriter, speed);
                } else {
                    document.getElementById('startBtn').style.display = 'block';
                }
            }
            typeWriter();
        }

        // ================= ЭКРАН 2: УСТАНОВКА ДАТЧИКА =================
        function startStep1() {
            const container = document.getElementById('gameContent');
            container.innerHTML = `
                <div class="glass-card">
                    <h2>Установка датчика температуры</h2>
                    <p class="step-desc">Перетащите правильный прибор из панели в монтажный слот на реакторе.</p>
                    
                    <div class="step-content-box">
                        <div class="reactor-slot" id="dropSlot" ondragover="allowDrop(event)" ondragleave="removeGlow(event)" ondrop="dropSensor(event)">
                            <span>Слот реактора</span>
                        </div>

                        <!-- Встроенное сообщение игры (вместо всплывающего окна alert) -->
                        <div class="inline-message" id="gameMessage"></div>

                        <div class="inventory-panel">
                            <div class="inventory-item" draggable="true" ondragstart="drag(event, 'p')">
                                <img src="p.png" alt="Манометр">
                                <span>Манометр</span>
                            </div>
                            <div class="inventory-item" draggable="true" ondragstart="drag(event, 't')">
                                <img src="t.png" alt="Термометр">
                                <span>Датчик температуры</span>
                            </div>
                            <div class="inventory-item" draggable="true" ondragstart="drag(event, 'geyg')">
                                <img src="geyg.png" alt="Счетчик Гейгера">
                                <span>Счетчик Гейгера</span>
                            </div>
                        </div>
                    </div>

                    <div class="hint-box" id="hintBox"></div>
                </div>
            `;

            startHintTimer("Нам нужно измерять степень нагрева активной зоны. Какой прибор отвечает за измерение температуры?");
        }

        function allowDrop(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.add('drag-over');
        }

        function removeGlow(ev) {
            ev.currentTarget.classList.remove('drag-over');
        }

        function drag(ev, type) {
            ev.dataTransfer.setData("text", type);
        }

        function dropSensor(ev) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            const slot = document.getElementById('dropSlot');
            slot.classList.remove('drag-over');

            if (data === 't') {
                clearTimeout(hintTimer);
                document.getElementById('hintBox').style.display = 'none';
                slot.innerHTML = `<img src="t.png" alt="Датчик установлен">`;
                slot.style.borderColor = '#4df3ff';
                slot.style.background = 'rgba(0, 210, 255, 0.2)';

                showGameMessage("✅ Датчик успешно установлен!", "success");

                setTimeout(() => {
                    alert("Датчик успешно установлен! Переходим к следующему шагу.");
                    // Здесь в дальнейшем перейдем к шагу 2
                }, 1500);

            } else {
                showGameMessage("❌ Ошибка, попробуйте ещё!", "error");
            }
        }

        // Функция показа внутриигрового сообщения на 3 секунды
        function showGameMessage(text, type) {
            const msg = document.getElementById('gameMessage');
            msg.className = `inline-message ${type}`;
            msg.innerText = text;
            msg.style.display = 'block';

            clearTimeout(messageTimer);
            messageTimer = setTimeout(() => {
                msg.style.display = 'none';
            }, 3000);
        }

        function startHintTimer(text) {
            clearTimeout(hintTimer);
            hintTimer = setTimeout(() => {
                const hint = document.getElementById('hintBox');
                hint.innerText = "💡 Подсказка: " + text;
                hint.style.display = 'block';
            }, 8000);
        }
    </script>
</body>
</html>
