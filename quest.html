<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инженерный квест: Оператор АЭС — Pro-БГУТ</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body.quest-body {
            background-color: #030b18;
            overflow-y: auto;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }

        .quest-container {
            width: 100vw;
            min-height: 100vh;
            /* Постоянный фон aes.jpg на всех шагах */
            background-image: linear-gradient(rgba(3, 11, 24, 0.75), rgba(3, 11, 24, 0.85)), url('aes.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 2.5vh 5vw;
            gap: 20px;
            box-sizing: border-box;
        }

        /* Шапка БГУТ */
        .quest-header {
            background-image: url('fon.jpg');
            background-size: cover;
            background-position: center;
            border: 1px solid rgba(0, 210, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            padding: 1vw 2.5vw;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 1200px;
            box-sizing: border-box;
        }

        .quest-header .logo-text h1 {
            color: #ffffff;
            font-size: 1.5vw;
            text-shadow: 0 0 12px rgba(0, 210, 255, 0.6);
        }

        .quest-header .logo-text p {
            color: #93bde8;
            font-size: 0.9vw;
        }

        /* Основной контент */
        .quest-main {
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        /* Стеклянная рамка для вводного экрана и заданий */
        .glass-card {
            background: rgba(13, 40, 75, 0.85);
            border: 2px solid rgba(0, 210, 255, 0.5);
            box-shadow: 0 20px 45px rgba(0, 150, 255, 0.25);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
            text-align: center;
            max-width: 850px;
            width: 100%;
            animation: fadeIn 0.5s ease forwards;
        }

        .glass-card h2 {
            color: #4df3ff;
            font-size: 2vw;
            font-weight: 800;
            margin: 0;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
        }

        .typewriter-text {
            color: #ffffff;
            font-size: 1.15vw;
            line-height: 1.6;
            margin: 0;
            min-height: 80px;
        }

        /* Слот монтажа для Шага 1 */
        .reactor-slot {
            width: 160px;
            height: 160px;
            border: 3px dashed #38bdf8;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 150, 255, 0.08);
            transition: all 0.3s ease;
            cursor: pointer;
            margin: 10px 0;
        }

        .reactor-slot.drag-over {
            border-color: #4df3ff;
            background: rgba(0, 210, 255, 0.25);
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.6);
        }

        .reactor-slot img {
            width: 90px;
            height: 90px;
            object-fit: contain;
        }

        .reactor-slot span {
            color: #93bde8;
            font-size: 0.85vw;
        }

        /* Панель инвентаря */
        .inventory-panel {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .inventory-item {
            background: rgba(255, 255, 255, 0.07);
            border: 2px solid rgba(0, 210, 255, 0.4);
            border-radius: 14px;
            padding: 12px;
            width: 110px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: grab;
            transition: all 0.3s ease;
        }

        .inventory-item:hover {
            border-color: #4df3ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
            transform: translateY(-3px);
        }

        .inventory-item img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        .inventory-item span {
            color: #ffffff;
            font-size: 0.8vw;
            font-weight: 600;
            text-align: center;
        }

        /* Подсказка */
        .hint-box {
            background: rgba(255, 193, 7, 0.15);
            border: 1px solid #ffc107;
            color: #ffe066;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.9vw;
            display: none;
            max-width: 800px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="quest-body" onload="initGame()">

    <div class="quest-container">
        
        <header class="quest-header">
            <div class="logo-box">
                <img src="emblema.png" alt="Эмблема БГУТ" class="logo-img" style="width: 45px; height: 45px;">
                <div class="logo-text">
                    <h1>Pro-БГУТ: студент на час</h1>
                    <p>Твой путь начинается здесь</p>
                </div>
            </div>
            <button class="pro-btn" id="btnBack" style="width: auto; padding: 8px 18px; font-size: 0.9vw;">Назад</button>
        </header>

        <main class="quest-main">
            <div id="gameContent"></div>
        </main>

    </div>

    <script>
        document.getElementById('btnBack').addEventListener('click', function() {
            window.location.href = 'testdrive.html';
        });

        let hintTimer = null;

        // ================= ЭКРАН 1: ВСТУПЛЕНИЕ =================
        function initGame() {
            const container = document.getElementById('gameContent');
            container.innerHTML = `
                <div class="glass-card">
                    <h2>Оператор АЭС: Спасти реактор</h2>
                    <p class="typewriter-text" id="introText"></p>
                    <button class="pro-btn" id="startBtn" style="display: none; padding: 12px 35px; font-size: 1.1vw; margin: 0 auto;" onclick="startStep1()">Начать!</button>
                </div>
            `;

            const fullText = "Внимание! На энергоблоке №1 зафиксирован сбой. Система охлаждения отключена, температура активной зоны стремительно растет! Если температура достигнет критической отметки — произойдет авария. Вы — дежурный инженер. Ваша задача — восстановить систему управления!";
            
            let i = 0;
            const speed = 25;
            const textElement = document.getElementById('introText');

            function typeWriter() {
                if (i < fullText.length) {
                    textElement.innerHTML += fullText.charAt(i);
                    i++;
                    setTimeout(typeWriter, speed);
                } else {
                    document.getElementById('startBtn').style.display = 'block';
                }
            }
            typeWriter();
        }

        // ================= ЭКРАН 2: УСТАНОВКА ДАТЧИКА =================
        function startStep1() {
            const container = document.getElementById('gameContent');
            container.innerHTML = `
                <div class="glass-card">
                    <h2>Установка датчика температуры</h2>
                    <p style="color: #e2e8f0; font-size: 1vw; margin: 0;">Система «слепа», температура реактора неизвестна. Перетащите правильный прибор из нижнего инвентаря в монтажный слот на реакторе.</p>
                    
                    <div class="reactor-slot" id="dropSlot" ondragover="allowDrop(event)" ondragleave="removeGlow(event)" ondrop="dropSensor(event)">
                        <span>Слот реактора</span>
                    </div>

                    <div class="inventory-panel">
                        <div class="inventory-item" draggable="true" ondragstart="drag(event, 'p')">
                            <img src="p.png" alt="Манометр">
                            <span>Манометр</span>
                        </div>
                        <div class="inventory-item" draggable="true" ondragstart="drag(event, 't')">
                            <img src="t.png" alt="Термометр">
                            <span>Датчик температуры</span>
                        </div>
                        <div class="inventory-item" draggable="true" ondragstart="drag(event, 'geyg')">
                            <img src="geyg.png" alt="Счетчик Гейгера">
                            <span>Счетчик Гейгера</span>
                        </div>
                    </div>

                    <div class="hint-box" id="hintBox"></div>
                </div>
            `;

            startHintTimer("Нам нужно измерять степень нагрева активной зоны. Какой прибор отвечает за измерение температуры?");
        }

        function allowDrop(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.add('drag-over');
        }

        function removeGlow(ev) {
            ev.currentTarget.classList.remove('drag-over');
        }

        function drag(ev, type) {
            ev.dataTransfer.setData("text", type);
        }

        function dropSensor(ev) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            const slot = document.getElementById('dropSlot');
            slot.classList.remove('drag-over');

            if (data === 't') {
                clearTimeout(hintTimer);
                slot.innerHTML = `<img src="t.png" alt="Датчик установлен">`;
                slot.style.borderColor = '#4df3ff';
                slot.style.background = 'rgba(0, 210, 255, 0.2)';

                setTimeout(() => {
                    alert('Датчик успешно установлен! Температура определена: 850°C.');
                    // Здесь в следующем шаге подключим экран настройки контроллера
                    alert('Переходим к следующему шагу...');
                }, 800);
            } else {
                alert('❌ Ошибка! Этот прибор не подходит для измерения температуры реактора.');
            }
        }

        function startHintTimer(text) {
            clearTimeout(hintTimer);
            hintTimer = setTimeout(() => {
                const hint = document.getElementById('hintBox');
                hint.innerText = "💡 Подсказка: " + text;
                hint.style.display = 'block';
            }, 8000);
        }
    </script>
</body>
</html>
