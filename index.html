<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro-БГУТ: Студент на час</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Модальное окно 360°-тура (для ПК и мобильных устройств) */
        .tour-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(3, 11, 24, 0.58);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .tour-modal-overlay.active {
            display: flex;
            animation: tourFadeIn 0.25s ease forwards;
        }

        @keyframes tourFadeIn {
            from { opacity: 0; transform: translateY(8px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Светлая стильная карточка на фоне fon2.jpg */
        .tour-modal-card {
            position: relative;
            width: 100%;
            max-width: 540px;
            background-image: linear-gradient(160deg, rgba(255, 255, 255, 0.88) 0%, rgba(240, 248, 255, 0.92) 100%), url('fon2.jpg');
            background-size: cover;
            background-position: center;
            border: 2px solid rgba(0, 153, 255, 0.45);
            box-shadow: 0 24px 60px rgba(3, 11, 24, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.7) inset;
            border-radius: 22px;
            padding: 34px 28px;
            color: #030b18;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .tour-modal-close {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1.5px solid rgba(0, 153, 255, 0.35);
            background: rgba(255, 255, 255, 0.9);
            color: #030b18;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.22s ease;
            box-shadow: 0 4px 12px rgba(0, 153, 255, 0.12);
        }

        .tour-modal-close:hover {
            background: #0099ff;
            border-color: #0099ff;
            color: #ffffff;
            transform: rotate(90deg);
        }

        .tour-modal-title {
            font-size: 24px;
            font-weight: 800;
            color: #030b18;
            text-align: center;
            padding: 0 28px;
            margin: 0;
            letter-spacing: -0.2px;
        }

        .tour-modal-title span {
            color: #0099ff;
        }

        .tour-locations-subtitle {
            font-size: 15px;
            font-weight: 600;
            color: #475569;
            text-align: center;
            margin: -4px 0 6px 0;
        }

        .tour-locations-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tour-choice-btn {
            position: relative;
            width: 100%;
            padding: 15px 22px;
            border-radius: 14px;
            border: 1.5px solid rgba(0, 210, 255, 0.55);
            background: linear-gradient(95deg, #071b38 0%, #0d3163 100%);
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.2px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-sizing: border-box;
            box-shadow: 0 10px 24px rgba(7, 27, 56, 0.22);
        }

        .tour-choice-btn:hover {
            background: linear-gradient(95deg, #0077cc 0%, #00a8ff 100%);
            border-color: #ffffff;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(0, 153, 255, 0.35);
        }

        .tour-choice-btn:active {
            transform: translateY(0);
        }

        /* СТРОГО ДЛЯ МОБИЛЬНЫХ УСТРОЙСТВ */
        @media (max-width: 768px) {
            html, body {
                height: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: hidden !important; /* Убираем прокрутку, всё в одном экране */
            }

            /* Делаем здание фоном на весь экран телефона */
            .page-container {
                position: relative !important;
                width: 100vw !important;
                height: 100vh !important;
                background-image: url('zdanie.png') !important; /* Здание теперь фон */
                background-size: cover !important;
                background-position: center !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: space-between !important;
                padding: 15px 12px !important;
                box-sizing: border-box !important;
            }

            /* Затемняем фон под зданием, чтобы текст и карточка отлично читались */
            .page-container::before {
                content: '' !important;
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                height: 100% !important;
                background: rgba(4, 13, 26, 0.65) !important; /* Полупрозрачная темная вуаль */
                z-index: 1 !important;
            }

            /* Все элементы интерфейса выводим поверх фонового здания */
            .header-section, .main-content {
                position: relative !important;
                z-index: 2 !important;
            }

            /* Увеличиваем логотип и текст в шапке, как на компьютере */
            .header-section .logo-box {
                display: flex !important;
                align-items: center !important;
                gap: 14px !important;
            }

            .header-section .logo-img {
                width: 52px !important;
                height: 52px !important;
            }

            .header-section .logo-text h1 {
                font-size: 19px !important;
                font-weight: 700 !important;
                color: #ffffff !important;
                margin: 0 0 2px 0 !important;
            }

            .header-section .logo-text p {
                font-size: 12px !important;
                color: #7dd3fc !important;
                margin: 0 !important;
            }

            /* Скрываем отдельный блок со старой картинкой здания, так как она теперь фон */
            .building-box {
                display: none !important;
            }

            /* Рамка с текстом и кнопками поверх экрана */
            .main-content {
                display: flex !important;
                flex-direction: column !important;
                justify-content: center !important;
                width: 100% !important;
                margin: auto 0 !important;
            }

            .info-buttons-wrapper {
                width: 100% !important;
                max-width: 100% !important;
                background: rgba(8, 24, 48, 0.88) !important;
                border: 1.5px solid rgba(0, 210, 255, 0.4) !important;
                backdrop-filter: blur(14px) !important;
                border-radius: 20px !important;
                padding: 20px 16px !important;
                box-sizing: border-box !important;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6) !important;
            }

            .text-block h2 {
                font-size: 18px !important;
                line-height: 1.25 !important;
                margin-bottom: 8px !important;
                color: #ffffff !important;
            }

            .text-block h2 span {
                color: #00d2ff !important;
            }

            .text-block p {
                font-size: 12.5px !important;
                line-height: 1.4 !important;
                color: #94a3b8 !important;
                margin-bottom: 16px !important;
            }

            .buttons-block {
                display: flex !important;
                flex-direction: column !important;
                gap: 10px !important;
            }

            .pro-btn {
                padding: 12px 14px !important;
                font-size: 13.5px !important;
                font-weight: 700 !important;
                width: 100% !important;
                box-sizing: border-box !important;
                border-radius: 12px !important;
            }

            .tour-modal-card {
                padding: 26px 18px;
                gap: 14px;
            }

            .tour-modal-title {
                font-size: 19px;
            }

            .tour-locations-subtitle {
                font-size: 13.5px;
            }

            .tour-choice-btn {
                font-size: 14.5px;
                padding: 13px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="page-container" style="background-image: url('fon.jpg');">
        
        <!-- Шапка: Эмблема и заголовок -->
        <header class="header-section">
            <div class="logo-box">
                <img src="emblema.png" alt="Эмблема БГУТ" class="logo-img">
                <div class="logo-text">
                    <h1>Pro-БГУТ: студент на час</h1>
                    <p>Твой путь начинается здесь</p>
                </div>
            </div>
        </header>

        <!-- Центральный контент -->
        <main class="main-content">
            <!-- Здание университета слева (на ПК) -->
            <div class="building-box">
                <img src="zdanie.png" alt="Здание БГУТ" class="building-img">
            </div>

            <!-- Правая карточка: текст и кнопки -->
            <div class="info-buttons-wrapper">
                <div class="text-block">
                    <h2>Выбор профессии —<br><span>инвестиции в будущее!</span></h2>
                    <p>Пройди виртуальный тест-драйв специальностей БГУТ. Сделай осознанный выбор своего будущего!</p>
                </div>

                <!-- Три интерактивные кнопки -->
                <div class="buttons-block">
                    <button type="button" class="pro-btn" id="btnTour">Виртуальный 360°-тур по университету</button>
                    <button type="button" class="pro-btn" id="btnTestDrive">Начать тест-драйв специальностей</button>
                    <button type="button" class="pro-btn" id="btnMore">Узнать больше о приемной кампании</button>
                </div>
            </div>
        </main>

    </div>

    <!-- Всплывающее окно выбора объекта 360°-тура -->
    <div class="tour-modal-overlay" id="tourModal" role="dialog" aria-modal="true" aria-labelledby="tourModalTitle">
        <div class="tour-modal-card">
            <button type="button" class="tour-modal-close" id="closeTourModal" aria-label="Закрыть окно">&times;</button>
            <h2 class="tour-modal-title" id="tourModalTitle">Виртуальный <span>360°-тур</span> по БГУТ</h2>
            <p class="tour-locations-subtitle">Выберите объект для просмотра:</p>

            <div class="tour-locations-list">
                <button type="button" class="tour-choice-btn" data-url="https://realty.yandex.ru/d3-embedded/player/31c4cacf-c16d-4117-b470-9061cbce5e14">Первый корпус</button>
                <button type="button" class="tour-choice-btn" data-url="https://realty.yandex.ru/d3-embedded/player/2aaa9477-e921-4601-9b7f-53fc4887f4a4">Второй корпус</button>
                <button type="button" class="tour-choice-btn" data-url="https://realty.yandex.ru/d3-embedded/player/2a643ed2-69cc-458d-a903-1d0dd239b0ce">Музей БГУТ</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const btnTour = document.getElementById('btnTour');
            const tourModal = document.getElementById('tourModal');
            const closeTourModal = document.getElementById('closeTourModal');
            const tourChoiceButtons = document.querySelectorAll('.tour-choice-btn');

            if (btnTour && tourModal) {
                btnTour.addEventListener('click', function() {
                    tourModal.classList.add('active');
                });
            }

            if (closeTourModal && tourModal) {
                closeTourModal.addEventListener('click', function() {
                    tourModal.classList.remove('active');
                });
            }

            if (tourModal) {
                tourModal.addEventListener('click', function(event) {
                    if (event.target === tourModal) {
                        tourModal.classList.remove('active');
                    }
                });
            }

            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape' && tourModal && tourModal.classList.contains('active')) {
                    tourModal.classList.remove('active');
                }
            });

            tourChoiceButtons.forEach(function(button) {
                button.addEventListener('click', function() {
                    const url = button.getAttribute('data-url');
                    if (url) {
                        window.open(url, '_blank');
                    }
                });
            });

            const btnTestDrive = document.getElementById('btnTestDrive');
            if (btnTestDrive) {
                btnTestDrive.addEventListener('click', function() {
                    window.location.href = 'testdrive.html';
                });
            }

            const btnMore = document.getElementById('btnMore');
            if (btnMore) {
                btnMore.addEventListener('click', function() {
                    window.open('https://www.abit.bgut.by/', '_blank');
                });
            }
        });
    </script>
</body>
</html>
