<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro-БГУТ: Студент на час</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Точечное подтягивание карточки вверх строго на экранах телефонов */
        @media (max-width: 768px) {
            .main-content {
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
            }
            .info-buttons-wrapper {
                margin-top: -25px !important; /* Подтягиваем карточку ближе к зданию */
                position: relative !important;
                z-index: 10 !important;
                width: 92% !important;
                box-sizing: border-box !important;
            }
            .building-img {
                max-height: 35vh !important;
                width: auto !important;
                object-fit: contain !important;
            }
        }
    </style>
</head>
<body>

    <div class="page-container" style="background-image: url('fon.jpg');">
        
        <!-- Шапка: Эмблема и заголовок -->
        <header class="header-section">
            <div class="logo-box">
                <img src="emblema.png" alt="Эмблема БГУТ" class="logo-img">
                <div class="logo-text">
                    <h1>Pro-БГУТ: студент на час</h1>
                    <p>Твой путь начинается здесь</p>
                </div>
            </div>
        </header>

        <!-- Центральный контент -->
        <main class="main-content">
            <!-- Здание университета слева -->
            <div class="building-box">
                <img src="zdanie.png" alt="Здание БГУТ" class="building-img">
            </div>

            <!-- Правая карточка: текст и кнопки -->
            <div class="info-buttons-wrapper">
                <div class="text-block">
                    <h2>Выбор профессии —<br><span>инвестиции в будущее!</span></h2>
                    <p>Пройди виртуальный тест-драйв специальностей БГУТ. Сделай осознанный выбор своего будущего!</p>
                </div>

                <!-- Три интерактивные кнопки -->
                <div class="buttons-block">
                    <button class="pro-btn" id="btnTour">Виртуальный 360°-тур</button>
                    <button class="pro-btn" id="btnTestDrive">Начать тест-драйв</button>
                    <button class="pro-btn" id="btnMore">Узнать больше</button>
                </div>
            </div>
        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
