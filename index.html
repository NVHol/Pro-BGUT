<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro-БГУТ: Студент на час</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Модальное окно 360°-тура (ПК и мобильные) */
        .tour-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(3, 11, 24, 0.85);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
        }

        .tour-modal-overlay.active {
            display: flex;
            animation: tourFadeIn 0.25s ease forwards;
        }

        @keyframes tourFadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        .tour-modal-card {
            position: relative;
            width: 100%;
            max-width: 520px;
            max-height: 92vh;
            overflow-y: auto;
            background: linear-gradient(145deg, rgba(11, 33, 64, 0.97) 0%, rgba(4, 14, 30, 0.99) 100%);
            border: 1.5px solid rgba(0, 210, 255, 0.55);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75), 0 0 30px rgba(0, 210, 255, 0.25);
            border-radius: 20px;
            padding: 24px 22px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            box-sizing: border-box;
        }

        .tour-modal-close {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid rgba(0, 210, 255, 0.45);
            background: rgba(13, 40, 75, 0.9);
            color: #4df3ff;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
        }

        .tour-modal-close:hover {
            background: #00d2ff;
            color: #030b18;
        }

        .tour-modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            padding-right: 28px;
            margin: 0;
        }

        .tour-modal-title span {
            color: #4df3ff;
        }

        /* Блок вертикального видео (7 сек) */
        .tour-video-stage {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .tour-vertical-video-box {
            width: min(260px, 68vw);
            aspect-ratio: 9 / 16;
            max-height: 52vh;
            border-radius: 16px;
            overflow: hidden;
            border: 1.5px solid rgba(0, 210, 255, 0.5);
            background: #020813;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55);
        }

        .tour-vertical-video-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .tour-skip-btn {
            background: transparent;
            color: #93bde8;
            border: 1px solid rgba(147, 189, 232, 0.45);
            border-radius: 10px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .tour-skip-btn:hover {
            color: #ffffff;
            border-color: #4df3ff;
            background: rgba(0, 210, 255, 0.15);
        }

        /* 3 кнопки выбора локации после видео */
        .tour-locations-stage {
            display: none;
            width: 100%;
            flex-direction: column;
            gap: 12px;
            animation: tourFadeIn 0.3s ease forwards;
        }

        .tour-locations-stage.visible {
            display: flex;
        }

        .tour-locations-subtitle {
            font-size: 14px;
            color: #b8d4f0;
            text-align: center;
            margin: 0 0 4px 0;
        }

        .tour-choice-btn {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1.5px solid rgba(0, 210, 255, 0.5);
            background: linear-gradient(90deg, rgba(13, 40, 75, 0.92) 0%, rgba(10, 30, 55, 0.92) 100%);
            color: #4df3ff;
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            box-sizing: border-box;
        }

        .tour-choice-btn:hover {
            background: linear-gradient(90deg, rgba(0, 210, 255, 0.28) 0%, rgba(13, 40, 75, 0.95) 100%);
            color: #ffffff;
            border-color: #4df3ff;
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(0, 210, 255, 0.35);
        }

        /* СТРОГО ДЛЯ МОБИЛЬНЫХ УСТРОЙСТВ */
        @media (max-width: 768px) {
            html, body {
                height: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: hidden !important; /* Убираем прокрутку, всё в одном экране */
            }

            /* Делаем здание фоном на весь экран телефона */
            .page-container {
                position: relative !important;
                width: 100vw !important;
                height: 100vh !important;
                background-image: url('zdanie.png') !important; /* Здание теперь фон */
                background-size: cover !important;
                background-position: center !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: space-between !important;
                padding: 15px 12px !important;
                box-sizing: border-box !important;
            }

            /* Затемняем фон под зданием, чтобы текст и карточка отлично читались */
            .page-container::before {
                content: '' !important;
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                height: 100% !important;
                background: rgba(4, 13, 26, 0.65) !important; /* Полупрозрачная темная вуаль */
                z-index: 1 !important;
            }

            /* Все элементы интерфейса выводим поверх фонового здания */
            .header-section, .main-content {
                position: relative !important;
                z-index: 2 !important;
            }

            /* Увеличиваем логотип и текст в шапке, как на компьютере */
            .header-section .logo-box {
                display: flex !important;
                align-items: center !important;
                gap: 14px !important;
            }

            .header-section .logo-img {
                width: 52px !important;
                height: 52px !important;
            }

            .header-section .logo-text h1 {
                font-size: 19px !important;
                font-weight: 700 !important;
                color: #ffffff !important;
                margin: 0 0 2px 0 !important;
            }

            .header-section .logo-text p {
                font-size: 12px !important;
                color: #7dd3fc !important;
                margin: 0 !important;
            }

            /* Скрываем отдельный блок со старой картинкой здания, так как она теперь фон */
            .building-box {
                display: none !important;
            }

            /* Рамка с текстом и кнопками поверх экрана */
            .main-content {
                display: flex !important;
                flex-direction: column !important;
                justify-content: center !important;
                width: 100% !important;
                margin: auto 0 !important;
            }

            .info-buttons-wrapper {
                width: 100% !important;
                max-width: 100% !important;
                background: rgba(8, 24, 48, 0.88) !important;
                border: 1.5px solid rgba(0, 210, 255, 0.4) !important;
                backdrop-filter: blur(14px) !important;
                border-radius: 20px !important;
                padding: 20px 16px !important;
                box-sizing: border-box !important;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6) !important;
            }

            .text-block h2 {
                font-size: 18px !important;
                line-height: 1.25 !important;
                margin-bottom: 8px !important;
                color: #ffffff !important;
            }

            .text-block h2 span {
                color: #00d2ff !important;
            }

            .text-block p {
                font-size: 12.5px !important;
                line-height: 1.4 !important;
                color: #94a3b8 !important;
                margin-bottom: 16px !important;
            }

            .buttons-block {
                display: flex !important;
                flex-direction: column !important;
                gap: 10px !important;
            }

            .pro-btn {
                padding: 12px 14px !important;
                font-size: 13.5px !important;
                font-weight: 700 !important;
                width: 100% !important;
                box-sizing: border-box !important;
                border-radius: 12px !important;
            }

            .tour-modal-card {
                padding: 20px 14px;
                max-height: 90vh;
            }

            .tour-modal-title {
                font-size: 17px;
            }

            .tour-vertical-video-box {
                width: min(210px, 60vw);
                max-height: 46vh;
            }

            .tour-choice-btn {
                font-size: 14px;
                padding: 12px 14px;
            }
        }
    </style>
</head>
<body>

    <div class="page-container" style="background-image: url('fon.jpg');">
        
        <!-- Шапка: Эмблема и заголовок -->
        <header class="header-section">
            <div class="logo-box">
                <img src="emblema.png" alt="Эмблема БГУТ" class="logo-img">
                <div class="logo-text">
                    <h1>Pro-БГУТ: студент на час</h1>
                    <p>Твой путь начинается здесь</p>
                </div>
            </div>
        </header>

        <!-- Центральный контент -->
        <main class="main-content">
            <!-- Здание университета слева (на ПК) -->
            <div class="building-box">
                <img src="zdanie.png" alt="Здание БГУТ" class="building-img">
            </div>

            <!-- Правая карточка: текст и кнопки -->
            <div class="info-buttons-wrapper">
                <div class="text-block">
                    <h2>Выбор профессии —<br><span>инвестиции в будущее!</span></h2>
                    <p>Пройди виртуальный тест-драйв специальностей БГУТ. Сделай осознанный выбор своего будущего!</p>
                </div>

                <!-- Три интерактивные кнопки -->
                <div class="buttons-block">
                    <button class="pro-btn" id="btnTour">Виртуальный 360°-тур по университету</button>
                    <button class="pro-btn" id="btnTestDrive">Начать тест-драйв специальностей</button>
                    <button class="pro-btn" id="btnMore">Узнать больше о приемной кампании</button>
                </div>
            </div>
        </main>

    </div>

    <!-- Модальное окно 360°-тура: видео (7 сек) -> 3 кнопки -->
    <div class="tour-modal-overlay" id="tourModal" role="dialog" aria-modal="true" aria-labelledby="tourModalTitle">
        <div class="tour-modal-card">
            <button type="button" class="tour-modal-close" id="closeTourModal" aria-label="Закрыть окно">&times;</button>
            <h2 class="tour-modal-title" id="tourModalTitle">Виртуальный <span>360°-тур</span> по БГУТ</h2>

            <!-- Этап 1: Вертикальное видео (7 сек) -->
            <div class="tour-video-stage" id="tourVideoStage">
                <div class="tour-vertical-video-box">
                    <video id="tourIntroVideo" playsinline autoplay muted preload="metadata">
                        <source src="tour-intro.mp4" type="video/mp4">
                    </video>
                </div>
                <button type="button" class="tour-skip-btn" id="skipTourVideo">Перейти к выбору локации</button>
            </div>

            <!-- Этап 2: 3 кнопки перехода по 360°-турам -->
            <div class="tour-locations-stage" id="tourLocationsStage">
                <p class="tour-locations-subtitle">Выберите объект для просмотра панорамы 360°:</p>
                <button type="button" class="tour-choice-btn" data-url="https://realty.yandex.ru/d3-embedded/player/31c4cacf-c16d-4117-b470-9061cbce5e14">Первый корпус</button>
                <button type="button" class="tour-choice-btn" data-url="https://realty.yandex.ru/d3-embedded/player/2aaa9477-e921-4601-9b7f-53fc4887f4a4">Второй корпус</button>
                <button type="button" class="tour-choice-btn" data-url="https://realty.yandex.ru/d3-embedded/player/cf229b1b-e716-416b-ba8c-5185bdaa772a">Музей БГУТ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
