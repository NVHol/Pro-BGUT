<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro-БГУТ: Студент на час</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* СТРОГО ДЛЯ МОБИЛЬНЫХ УСТРОЙСТВ */
        @media (max-width: 768px) {
            html, body {
                height: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: hidden !important; /* Убираем прокрутку, всё в одном экране */
            }

            /* Делаем здание фоном на весь экран телефона */
            .page-container {
                position: relative !important;
                width: 100vw !important;
                height: 100vh !important;
                background-image: url('zdanie.png') !important; /* Здание теперь фон */
                background-size: cover !important;
                background-position: center !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: space-between !important;
                padding: 15px 12px !important;
                box-sizing: border-box !important;
            }

            /* Затемняем фон под зданием, чтобы текст и карточка отлично читались */
            .page-container::before {
                content: '' !important;
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                height: 100% !important;
                background: rgba(4, 13, 26, 0.65) !important; /* Полупрозрачная темная вуаль */
                z-index: 1 !important;
            }

            /* Все элементы интерфейса выводим поверх фонового здания */
            .header-section, .main-content {
                position: relative !important;
                z-index: 2 !important;
            }

            /* Увеличиваем логотип и текст в шапке, как на компьютере */
            .header-section .logo-box {
                display: flex !important;
                align-items: center !important;
                gap: 14px !important;
            }

            .header-section .logo-img {
                width: 52px !important;
                height: 52px !important;
            }

            .header-section .logo-text h1 {
                font-size: 19px !important;
                font-weight: 700 !important;
                color: #ffffff !important;
                margin: 0 0 2px 0 !important;
            }

            .header-section .logo-text p {
                font-size: 12px !important;
                color: #7dd3fc !important;
                margin: 0 !important;
            }

            /* Скрываем отдельный блок со старой картинкой здания, так как она теперь фон */
            .building-box {
                display: none !important;
            }

            /* Рамка с текстом и кнопками поверх экрана */
            .main-content {
                display: flex !important;
                flex-direction: column !important;
                justify-content: center !important;
                width: 100% !important;
                margin: auto 0 !important;
            }

            .info-buttons-wrapper {
                width: 100% !important;
                max-width: 100% !important;
                background: rgba(8, 24, 48, 0.88) !important;
                border: 1.5px solid rgba(0, 210, 255, 0.4) !important;
                backdrop-filter: blur(14px) !important;
                border-radius: 20px !important;
                padding: 20px 16px !important;
                box-sizing: border-box !important;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6) !important;
            }

            .text-block h2 {
                font-size: 18px !important;
                line-height: 1.25 !important;
                margin-bottom: 8px !important;
                color: #ffffff !important;
            }

            .text-block h2 span {
                color: #00d2ff !important;
            }

            .text-block p {
                font-size: 12.5px !important;
                line-height: 1.4 !important;
                color: #94a3b8 !important;
                margin-bottom: 16px !important;
            }

            .buttons-block {
                display: flex !important;
                flex-direction: column !important;
                gap: 10px !important;
            }

            .pro-btn {
                padding: 12px 14px !important;
                font-size: 13.5px !important;
                font-weight: 700 !important;
                width: 100% !important;
                box-sizing: border-box !important;
                border-radius: 12px !important;
            }
        }
    </style>
</head>
<body>

    <div class="page-container" style="background-image: url('fon.jpg');">
        
        <!-- Шапка: Эмблема и заголовок -->
        <header class="header-section">
            <div class="logo-box">
                <img src="emblema.png" alt="Эмблема БГУТ" class="logo-img">
                <div class="logo-text">
                    <h1>Pro-БГУТ: студент на час</h1>
                    <p>Твой путь начинается здесь</p>
                </div>
            </div>
        </header>

        <!-- Центральный контент -->
        <main class="main-content">
            <!-- Здание университета слева (на ПК) -->
            <div class="building-box">
                <img src="zdanie.png" alt="Здание БГУТ" class="building-img">
            </div>

            <!-- Правая карточка: текст и кнопки -->
            <div class="info-buttons-wrapper">
                <div class="text-block">
                    <h2>Выбор профессии —<br><span>инвестиции в будущее!</span></h2>
                    <p>Пройди виртуальный тест-драйв специальностей БГУТ. Сделай осознанный выбор своего будущего!</p>
                </div>

                <!-- Три интерактивные кнопки -->
                <div class="buttons-block">
                    <button class="pro-btn" id="btnTour">Виртуальный 360°-тур по университету</button>
                    <button class="pro-btn" id="btnTestDrive">Начать тест-драйв специальностей</button>
                    <button class="pro-btn" id="btnMore">Узнать больше о приемной кампании</button>
                </div>
            </div>
        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
