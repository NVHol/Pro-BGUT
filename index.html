<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro-БГУТ: Студент на час</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* СТРОГО ДЛЯ ТЕЛЕФОНОВ (до 768px). На ПК этот блок браузер игнорирует! */
        @media (max-width: 768px) {
            /* 1. Сбрасываем жесткую высоту экрана, чтобы не было гигантских разрывов */
            html, body, .page-container {
                height: auto !important;
                min-height: 100vh !important;
                padding: 10px 12px 20px 12px !important;
                box-sizing: border-box !important;
            }

            /* 2. На телефоне выстраиваем элементы вертикально */
            .main-content {
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                gap: 0px !important; /* Убираем пустой зазор между зданием и карточкой */
                margin-top: 5px !important;
            }

            /* 3. Уменьшаем размер здания на мобильном */
            .building-box {
                width: 100% !important;
                display: flex !important;
                justify-content: center !important;
                margin-bottom: -15px !important; /* Легкая нахлестка/подтягивание карточки к зданию */
            }

            .building-img {
                max-height: 30vh !important; /* Ограничиваем высоту здания */
                width: auto !important;
                object-fit: contain !important;
            }

            /* 4. Подтягиваем карточку вверх и сжимаем её внутренние отступы */
            .info-buttons-wrapper {
                width: 100% !important;
                max-width: 100% !important;
                padding: 16px 14px !important;
                margin-top: 0 !important;
                box-sizing: border-box !important;
            }

            /* 5. Уменьшаем размер шрифтов для телефона */
            .text-block h2 {
                font-size: 17px !important; /* Компактный заголовок */
                line-height: 1.25 !important;
                margin-bottom: 6px !important;
            }

            .text-block p {
                font-size: 12px !important; /* Уменьшенный текст описания */
                line-height: 1.35 !important;
                margin-bottom: 12px !important;
            }

            /* 6. Уменьшаем кнопки и шрифты на них */
            .buttons-block {
                display: flex !important;
                flex-direction: column !important;
                gap: 8px !important;
            }

            .pro-btn {
                padding: 11px 12px !important; /* Меньше высота кнопок */
                font-size: 13px !important;   /* Аккуратный шрифт на кнопке */
                width: 100% !important;
                box-sizing: border-box !important;
            }

            .header-section .logo-text h1 {
                font-size: 15px !important;
            }

            .header-section .logo-text p {
                font-size: 11px !important;
            }
        }
    </style>
</head>
<body>

    <div class="page-container" style="background-image: url('fon.jpg');">
        
        <!-- Шапка: Эмблема и заголовок -->
        <header class="header-section">
            <div class="logo-box">
                <img src="emblema.png" alt="Эмблема БГУТ" class="logo-img">
                <div class="logo-text">
                    <h1>Pro-БГУТ: студент на час</h1>
                    <p>Твой путь начинается здесь</p>
                </div>
            </div>
        </header>

        <!-- Центральный контент -->
        <main class="main-content">
            <!-- Здание университета слева -->
            <div class="building-box">
                <img src="zdanie.png" alt="Здание БГУТ" class="building-img">
            </div>

            <!-- Правая карточка: текст и кнопки -->
            <div class="info-buttons-wrapper">
                <div class="text-block">
                    <h2>Выбор профессии —<br><span>инвестиции в будущее!</span></h2>
                    <p>Пройди виртуальный тест-драйв специальностей БГУТ. Сделай осознанный выбор своего будущего!</p>
                </div>

                <!-- Три интерактивные кнопки -->
                <div class="buttons-block">
                    <button class="pro-btn" id="btnTour">Виртуальный 360°-тур</button>
                    <button class="pro-btn" id="btnTestDrive">Начать тест-драйв</button>
                    <button class="pro-btn" id="btnMore">Узнать больше</button>
                </div>
            </div>
        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
