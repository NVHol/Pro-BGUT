<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro-БГУТ: Студент на час</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* СТРОГО ДЛЯ МОБИЛЬНЫХ УСТРОЙСТВ: меняем порядок блоков и подтягиваем всё вверх */
        @media (max-width: 768px) {
            html, body {
                height: auto !important;
                min-height: 100vh !important;
                background-color: #040d1a !important;
            }

            .page-container {
                position: relative !important;
                height: auto !important;
                min-height: 100vh !important;
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                justify-content: flex-start !important;
                padding: 12px 10px 30px 10px !important;
                box-sizing: border-box !important;
            }

            .header-section {
                width: 100% !important;
                margin-bottom: 12px !important;
            }

            .header-section .logo-text h1 {
                font-size: 14px !important;
            }

            .header-section .logo-text p {
                font-size: 10px !important;
            }

            .main-content {
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                width: 100% !important;
                gap: 12px !important;
                margin: 0 !important;
            }

            /* ГЛАВНЫЙ ФОКУС: Меняем местами блоки через order ТОЛЬКО на телефоне! */
            .info-buttons-wrapper {
                order: 1 !important; /* Карточка с текстом и кнопками идет ПЕРВОЙ */
                width: 100% !important;
                max-width: 100% !important;
                margin-top: 0 !important;
                padding: 16px 14px !important;
                box-sizing: border-box !important;
                background: rgba(8, 24, 48, 0.92) !important;
                border-radius: 16px !important;
            }

            .building-box {
                order: 2 !important; /* Здание идет ВТОРЫМ (под карточкой) */
                width: 100% !important;
                display: flex !important;
                justify-content: center !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            .building-img {
                max-height: 26vh !important;
                width: auto !important;
                object-fit: contain !important;
            }

            .text-block h2 {
                font-size: 16px !important;
                line-height: 1.2 !important;
                margin-bottom: 4px !important;
            }

            .text-block p {
                font-size: 11px !important;
                line-height: 1.3 !important;
                margin-bottom: 12px !important;
            }

            .buttons-block {
                display: flex !important;
                flex-direction: column !important;
                gap: 8px !important;
            }

            .pro-btn {
                padding: 10px 12px !important;
                font-size: 12px !important;
                width: 100% !important;
                box-sizing: border-box !important;
            }
        }
    </style>
</head>
<body>

    <div class="page-container" style="background-image: url('fon.jpg');">
        
        <!-- Шапка: Эмблема и заголовок -->
        <header class="header-section">
            <div class="logo-box">
                <img src="emblema.png" alt="Эмблема БГУТ" class="logo-img">
                <div class="logo-text">
                    <h1>Pro-БГУТ: студент на час</h1>
                    <p>Твой путь начинается здесь</p>
                </div>
            </div>
        </header>

        <!-- Центральный контент -->
        <main class="main-content">
            <!-- Здание университета слева -->
            <div class="building-box">
                <img src="zdanie.png" alt="Здание БГУТ" class="building-img">
            </div>

            <!-- Правая карточка: текст и кнопки -->
            <div class="info-buttons-wrapper">
                <div class="text-block">
                    <h2>Выбор профессии —<br><span>инвестиции в будущее!</span></h2>
                    <p>Пройди виртуальный тест-драйв специальностей БГУТ. Сделай осознанный выбор своего будущего!</p>
                </div>

                <!-- Три интерактивные кнопки -->
                <div class="buttons-block">
                    <button class="pro-btn" id="btnTour">Виртуальный 360°-тур</button>
                    <button class="pro-btn" id="btnTestDrive">Начать тест-драйв</button>
                    <button class="pro-btn" id="btnMore">Узнать больше</button>
                </div>
            </div>
        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
