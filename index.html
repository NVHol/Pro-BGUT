<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro-БГУТ: Студент на час</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Главный контейнер-фон -->
    <div class="page-container" style="background-image: url('fon.jpg');">
        
        <!-- Верхняя шарка: Эмблема и заголовок -->
        <header class="header-section">
            <div class="logo-box">
                <img src="emblema.png" alt="Эмблема БГУТ" class="logo-img">
                <div class="logo-text">
                    <h1>Pro-БГУТ: студент на час</h1>
                    <p>Твой путь начинается здесь</p>
                </div>
            </div>
        </header>

        <!-- Центральный контент: Здание слева, текст и кнопки справа -->
        <main class="main-content">
            <!-- Здание университета -->
            <div class="building-box">
                <img src="zdanie.png" alt="Здание БГУТ" class="building-img">
            </div>

            <!-- Правый блок: Текст и кнопки -->
            <div class="info-buttons-wrapper">
                <div class="text-block">
                    <h2>Выбор профессии —<br>инвестиции в будущее!</h2>
                    <p>Пройди виртуальный тест-драйв специальностей БГУТ.<br>Сделай осознанный выбор своего будущего!</p>
                </div>

                <!-- Три интерактивные кнопки -->
                <div class="buttons-block">
                    <button class="pro-btn" id="btnTour"> Виртуальный 360°-тур</button>
                    <button class="pro-btn" id="btnTestDrive"> Начать тест-драйв</button>
                    <button class="pro-btn" id="btnMore"> Узнать больше</button>
                </div>
            </div>
        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
