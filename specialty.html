<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор специальности — Pro-БГУТ</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body.specialty-body {
            background-color: #ffffff;
            overflow-y: auto;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }

        .specialty-container {
            width: 100vw;
            min-height: 100vh;
            background: linear-gradient(135deg, #f4f8fc 0%, #eef4f9 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 2.5vh 5vw;
            gap: 25px;
            box-sizing: border-box;
        }

        /* Шапка БГУТ */
        .specialty-header {
            background-image: url('fon.jpg');
            background-size: cover;
            background-position: center;
            border: 1px solid rgba(0, 210, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 1vw 2.5vw;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 1100px;
            box-sizing: border-box;
        }

        .specialty-header .logo-text h1 {
            color: #ffffff;
            font-size: 1.5vw;
            text-shadow: 0 0 12px rgba(0, 210, 255, 0.6);
        }

        .specialty-header .logo-text p {
            color: #93bde8;
            font-size: 0.9vw;
        }

        /* Основной контент */
        .specialty-main {
            max-width: 1100px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 25px;
            text-align: center;
        }

        .specialty-title h2 {
            color: #030b18;
            font-size: 2vw;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .specialty-title h2 span {
            color: #0099ff;
        }

        .specialty-title p {
            color: #557090;
            font-size: 0.95vw;
        }

        /* Сетка для вариантов ответов (2 столбца) */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
        }

        /* Карточка-квадрат для ответа */
        .option-card {
            position: relative;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(0, 210, 255, 0.4);
            box-shadow: 0 10px 30px rgba(0, 150, 255, 0.12);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 35px 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option-card:hover {
            border-color: #00d2ff;
            box-shadow: 0 15px 35px rgba(0, 210, 255, 0.3);
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.98);
        }

        .option-card span {
            color: #030b18;
            font-size: 1.2vw;
            font-weight: 600;
        }

        /* Выбранный вариант */
        .option-card.selected {
            background: linear-gradient(135deg, rgba(13, 40, 75, 0.95) 0%, rgba(5, 20, 40, 0.98) 100%);
            border-color: #4df3ff;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.5);
        }

        .option-card.selected span {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
        }
    </style>
</head>
<body class="specialty-body">

    <div class="specialty-container">
        
        <!-- Шапка БГУТ с кнопкой "Назад" -->
        <header class="specialty-header">
            <div class="logo-box">
                <img src="emblema.png" alt="Эмблема БГУТ" class="logo-img" style="width: 45px; height: 45px;">
                <div class="logo-text">
                    <h1>Pro-БГУТ: студент на час</h1>
                    <p>Твой путь начинается здесь</p>
                </div>
            </div>
            <button class="pro-btn" id="btnBack" style="width: auto; padding: 8px 18px; font-size: 0.9vw;">Назад</button>
        </header>

        <!-- Основная часть с вопросом и квадратами ответов -->
        <main class="specialty-main">
            <div class="specialty-title">
                <h2>Какие предметы ЦЭ/ЦТ <span>ты планируешь сдавать?</span></h2>
                <p>Выбери комбинацию предметов, чтобы узнать подходящие специальности</p>
            </div>

            <!-- Два столбца с ответами (квадраты) -->
            <div class="options-grid">
                <div class="option-card" onclick="selectOption(this)">
                    <span>Математика и Физика</span>
                </div>
                <div class="option-card" onclick="selectOption(this)">
                    <span>Химия и Биология</span>
                </div>
                <div class="option-card" onclick="selectOption(this)">
                    <span>Химия и Математика</span>
                </div>
                <div class="option-card" onclick="selectOption(this)">
                    <span>Математика и Иностранный язык</span>
                </div>
            </div>
        </main>

    </div>

    <script>
        // Кнопка возврата на страницу тест-драйва
        document.getElementById('btnBack').addEventListener('click', function() {
            window.location.href = 'testdrive.html';
        });

        // Функция выбора варианта ответа
        function selectOption(card) {
            // Убираем выбор у других карточек
            const cards = document.querySelectorAll('.option-card');
            cards.forEach(c => c.classList.remove('selected'));
            
            // Выделяем текущую
            card.classList.add('selected');
        }
    </script>
</body>
</html>
